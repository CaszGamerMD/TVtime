name: Windows Test Bundle

concurrency:
  group: caszual_tv_time-windows-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "native/windows/**"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - ".github/workflows/windows-test-bundle.yml"

jobs:
  bundle:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Configure native helper
        shell: pwsh
        run: cmake -S native/windows -B native/windows/build -A x64

      - name: Build native helper
        shell: pwsh
        run: cmake --build native/windows/build --config Release

      - name: Embed native helper in client resources
        shell: pwsh
        run: |
          $target = "src/client/resources/caszual_tv_time/native/windows-x64"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item native/windows/build/Release/caszual-tv-time-capture.exe "$target/caszual-tv-time-capture.exe"

      - name: Build Fabric mod
        shell: pwsh
        run: gradle build --stacktrace

      - name: Verify self-contained mod jar
        shell: pwsh
        run: |
          $jar = Get-ChildItem build/libs/*.jar |
            Where-Object { $_.Name -notmatch "sources" } |
            Select-Object -First 1

          if (-not $jar) {
            throw "No Caszual TV Time mod jar was produced."
          }

          $entries = jar tf $jar.FullName

          if (-not ($entries -contains "caszual_tv_time/native/windows-x64/caszual-tv-time-capture.exe")) {
            throw "Caszual TV Time JAR is missing bundled caszual-tv-time-capture.exe"
          }

          if (-not ($entries | Where-Object { $_ -match "^META-INF/jars/.*jcodec.*\.jar$" })) {
            throw "Caszual TV Time JAR is missing bundled JCodec"
          }

          if (-not ($entries | Where-Object { $_ -match "^META-INF/jars/.*[Cc]oncentus.*\.jar$" })) {
            throw "Caszual TV Time JAR is missing bundled Concentus"
          }

      - name: Assemble test bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null

          $jar = Get-ChildItem build/libs/*.jar |
            Where-Object { $_.Name -notmatch "sources" } |
            Select-Object -First 1

          if (-not $jar) {
            throw "No Caszual TV Time mod jar was produced."
          }

          Copy-Item $jar.FullName bundle/$($jar.Name)

          @"
          Caszual TV Time Windows development bundle

          1. Put the Caszual TV Time JAR in your Minecraft mods folder.
          2. Start Minecraft. The Windows capture helper is bundled inside
             the JAR and is extracted automatically to:
             config/caszual_tv_time/native/caszual-tv-time-capture.exe
          3. /caszual_tv_time_capture windows
          4. /caszual_tv_time_capture start <windowIndex> <channel>
          5. Look at a connected TV wall and run:
             /caszual_tv_time_capture tune <channel>

          Current real-window development stream:
          - AUTO video codec prefers H.264 (JCodec baseline)
          - automatic fallback to delta-Deflate
          - periodic keyframes + packet-loss recovery
          - bounded media fragmentation/reassembly
          - selected-process Opus audio (48 kHz stereo)
          - automatic raw PCM fallback
          - positional mono TV/speaker playback

          Capture quality controls:
          /caszual_tv_time_capture quality LOW
            192x108 @ 12 FPS
          /caszual_tv_time_capture quality BALANCED
            320x180 @ 15 FPS (default)
          /caszual_tv_time_capture quality HIGH
            640x360 @ 20 FPS

          Codec controls:
          /caszual_tv_time_capture codec AUTO
          /caszual_tv_time_capture codec H264
          /caszual_tv_time_capture codec DELTA

          AUTO is the recommended test mode.

          Speaker test:
          1. Place a Caszual TV Time Speaker block.
          2. Look directly at it.
          3. Run:
             /caszual_tv_time_test speaker <channel> <role> [volume] [range]

          Roles:
          FULL, LEFT, RIGHT, CENTER, REAR_LEFT, REAR_RIGHT, LFE

          LEFT/REAR_LEFT use the captured left stereo channel.
          RIGHT/REAR_RIGHT use the captured right stereo channel.
          FULL/CENTER/LFE currently downmix both channels to mono.

          /caszual_tv_time_capture status shows current FPS, combined kbps,
          active video codec, audio codec, quality profile, and video compression ratio.

          This build validates the full capture -> compression -> server
          relay -> remote connected-TV video + multi-speaker positional
          audio path with H.264 + Opus enabled by default, while both retain
          safe fallback paths for troubleshooting.
          "@ | Set-Content -Encoding UTF8 bundle/TESTING.txt

      - name: Upload Windows test bundle
        uses: actions/upload-artifact@v4
        with:
          name: Caszual-TV-Time-Windows-Test
          path: bundle/*

      - name: Publish verified package to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $jar = Get-ChildItem build/libs/*.jar |
            Where-Object { $_.Name -notmatch "sources" } |
            Select-Object -First 1

          if (-not $jar) {
            throw "No verified Caszual TV Time mod jar was produced."
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $packageName = "caszual-tv-time-0.1.0-alpha.3.jar"
          Get-ChildItem dist/caszual-tv-time-*.jar -ErrorAction SilentlyContinue | Remove-Item -Force
          Copy-Item $jar.FullName "dist/$packageName" -Force
          Copy-Item bundle/TESTING.txt dist/TESTING.txt -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A dist

          if (git diff --cached --quiet) {
            Write-Host "Verified package is already current in dist/."
            exit 0
          }

          git commit -m "Package Caszual TV Time 0.1.0-alpha.3"
          git push origin HEAD:main
